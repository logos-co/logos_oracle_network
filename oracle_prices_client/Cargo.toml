[package]
name = "oracle_prices_client"
version = "0.1.0"
edition = "2024"

[dependencies]
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core" }
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.5", features = ["derive"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

nssa        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee" }
common      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = ["client"] }
wallet      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
hex         = "0.4"
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.7.0" }
spel-framework-core = { git = "https://github.com/logos-co/spel.git", tag = "v0.7.0" }
tokio       = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1.0.104"

[features]
# e2e tests require a running Logos blockchain (LEZ sequencer)
e2e_lbc = []

[dev-dependencies]
e2e_utils = { path = "../e2e_utils" }
oracle_prices_core = { path = "../oracle_prices/oracle_prices_core" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serial_test = "3"
tempfile = "3"
rand = "0.8"
tracing = "0.1"
